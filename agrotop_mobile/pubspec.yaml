name: agrotop_mobile
description: "Aplicativo Mobile Nativo do AgroTop (Gestão de Gado de Corte) em Flutter para Android e iOS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Supabase SDK (Auth, Database, Storage)
  supabase_flutter: ^2.3.4
  
  # Networking & HTTP
  http: ^1.2.0
  dio: ^5.4.1
  
  # UI, Icons & Formatting
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  mask_text_input_formatter: ^2.9.0
  flutter_spinkit: ^5.2.0
  
  # Camera & File Upload
  image_picker: ^1.0.7
  flutter_image_compress: ^2.2.0
  
  # Local Offline Storage & Sync
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
