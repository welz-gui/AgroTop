# Build remoto do backend_api via Dockerfile.api — usado porque
# `gcloud run deploy --source` só reconhece um arquivo chamado
# literalmente "Dockerfile" na raiz do contexto, e este repositório
# já tem um (o do app web, spec 0081). Roda inteiramente no Cloud
# Build, sem depender de Docker local.
#
# Uso: gcloud builds submit --config=cloudbuild.api.yaml \
#        --substitutions=_IMAGE=<repositório>/backend-api .
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "Dockerfile.api", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  # Canal de release da VM de worker do Cloud Build (so o ambiente do host: Docker/Debian).
  # Em 28/03/2027 o Google torna o `regular` o padrao (aviso de 05/10/2026); fixado aqui
  # para validar a mudanca antes. Ver https://docs.cloud.google.com/build/docs/release-channels
  workerRelease: regular
