name: Build AgroTop Mobile PoC APK

on:
  workflow_dispatch:
  push:
    paths:
      - "poc/mobile/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/mobile
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: poc/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: APK de depuração
        run: flutter build apk --debug --dart-define=AGROTOP_API_URL=https://api.example.invalid

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: AgroTop-Mobile-PoC-APK
          path: poc/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
