name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificação de compilação
        run: python -m compileall app.py database.py repositories services ui tests tools

      # `-t .` é obrigatório: faz `tests` ser importado como pacote, o que executa
      # tests/__init__.py e isola a suíte do banco de produção. Sem isso, o teste
      # tests/test_isolamento.py falha de propósito.
      - name: Testes unitários
        run: python -m unittest discover -s tests -t . -v
