name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrotop_test
          POSTGRES_PASSWORD: agrotop_test
          POSTGRES_DB: agrotop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrotop_test -d agrotop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependências da API
        run: pip install -r backend_api/requirements.txt

      - name: Verificação de compilação
        run: python -m compileall app.py database.py repositories services ui tests tools

      # `-t .` é obrigatório: faz `tests` ser importado como pacote, o que executa
      # tests/__init__.py e isola a suíte do banco de produção. Sem isso, o teste
      # tests/test_isolamento.py falha de propósito.
      - name: Testes — SQLite
        env:
          AGROTOP_FORCE_SQLITE: "1"
        run: python -m unittest discover -s tests -t . -v

      - name: Preparar schema PostgreSQL efêmero
        env:
          PGPASSWORD: agrotop_test
        run: |
          # 0000_baseline_producao.sql é um snapshot de produção (tools/dump_schema_nuvem.py),
          # não um schema vazio — a cada regeneração ele passa a incluir o efeito de
          # todas as migrations aplicadas até aquele momento. Última regeneração:
          # commit 95c8859, 2026-08-19 (já inclui até a migration 0024).
          # Reaplicar uma migration já contida no baseline só é seguro se ela usar
          # guarda (IF EXISTS/IF NOT EXISTS) — confirmado migration por migração até
          # a 0024. A única exceção real é a 0017 (animals_uuid_vira_pk): faz
          # DROP CONSTRAINT animals_pkey sem guarda, e o baseline já criou essa
          # mesma constraint com 14 FKs dependendo dela — reaplicar quebra.
          # ponytail: lista de exclusão manual, não detecção automática do que já
          # está no baseline. Se 0000_baseline_producao.sql for regenerado de novo
          # (procure por "chore: regenera baseline" no histórico), reconferir se
          # alguma migration nova entre 0007 e a nova data de corte também precisa
          # entrar nesta exclusão (só migrations sem IF EXISTS/IF NOT EXISTS em
          # DROP/ALTER de constraint são candidatas).
          psql -h localhost -U agrotop_test -d agrotop_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/0000_baseline_producao.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f" | cut -c1-4)
            if [ "$n" != "0000" ] && [ "$n" != "0017" ] && [ "$((10#$n))" -ge 7 ]; then
              psql -h localhost -U agrotop_test -d agrotop_test -v ON_ERROR_STOP=1 -f "$f"
            fi
          done

      # tests/__init__.py continua forçando SQLite no processo principal. Os
      # testes de integração abrem subprocessos e removem essa trava somente
      # para este Postgres efêmero, sem expor nem alcançar credencial real.
      - name: Testes — PostgreSQL
        env:
          AGROTOP_TEST_POSTGRES: "1"
          DATABASE_URL: postgresql://agrotop_test:agrotop_test@localhost:5432/agrotop_test
        run: python -m unittest discover -s tests -t . -v
