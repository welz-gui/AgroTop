name: Mobile CI (Flutter)

# Existia como mobile/build_apk.yml — fora de .github/workflows/, o GitHub Actions
# nunca o executava, e o gatilho original só disparava em `push`, nunca em
# `pull_request`. Efeito prático: nenhuma PR que tocasse mobile/ teve
# flutter analyze/test/build verificados de verdade antes do merge — "CI verde"
# em specs 0047/0049/0051/0053 provava só que o lado Python não quebrou (mesmo
# gap de fundo do Defeito 1 da spec 0044, agora do lado Flutter). Movido para
# aqui e com `pull_request:` adicionado corrige isso.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "mobile/**"
  pull_request:
    paths:
      - "mobile/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: app_colors.dart não diverge de ui/tema.py
        run: |
          python3 tool/generate_app_colors.py
          git diff --exit-code -- lib/app_colors.dart

      - name: APK de depuração
        run: flutter build apk --debug --dart-define=AGROTOP_API_URL=https://api.example.invalid

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: AgroTop-Mobile-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
